name: Release Desktop App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    environment: "ghostove desktop"
    permissions:
      contents: write
    env:
      VITE_BACKEND_API_URL: ${{ vars.VITE_BACKEND_API_URL }}
      VITE_WS_URL: ${{ vars.VITE_WS_URL }}
      VITE_WEB_API_URL: ${{ vars.VITE_WEB_API_URL }}
    strategy:
      fail-fast: false
      # The Tauri action updates latest.json from each matrix job. Serialize
      # publishers so one platform cannot overwrite the other's updater entry.
      max-parallel: 1
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set auto-incremental version
        id: versioning
        shell: bash
        env:
          NEW_VERSION: 1.0.${{ github.run_number }}
        run: |
          echo "Setting build version to $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          node -e "
            const fs = require('fs');
            const v = process.env.NEW_VERSION;
            // Update package.json
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = v;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

            // Update src-tauri/tauri.conf.json
            const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            tauri.version = v;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2) + '\n');

            // Update src-tauri/Cargo.toml
            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/^version = .*/m, 'version = \"' + v + '\"');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);
          "

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate production environment
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GHOSTOVE_RELEASES_TOKEN: ${{ secrets.GHOSTOVE_RELEASES_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$VITE_BACKEND_API_URL" || { echo "::error::Missing Actions variable VITE_BACKEND_API_URL"; exit 1; }
          test -n "$VITE_WS_URL" || { echo "::error::Missing Actions variable VITE_WS_URL"; exit 1; }
          test -n "$VITE_WEB_API_URL" || { echo "::error::Missing Actions variable VITE_WEB_API_URL"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::Missing Actions secret TAURI_SIGNING_PRIVATE_KEY in the ghostove desktop environment"; exit 1; }
          test -n "$GHOSTOVE_RELEASES_TOKEN" || { echo "::error::Missing Actions secret GHOSTOVE_RELEASES_TOKEN in the ghostove desktop environment"; exit 1; }
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test -n "$APPLE_CERTIFICATE" || { echo "::error::Missing Actions secret APPLE_CERTIFICATE in the ghostove desktop environment"; exit 1; }
            test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo "::error::Missing Actions secret APPLE_CERTIFICATE_PASSWORD in the ghostove desktop environment"; exit 1; }
            test -n "$APPLE_SIGNING_IDENTITY" || { echo "::error::Missing Actions secret APPLE_SIGNING_IDENTITY in the ghostove desktop environment"; exit 1; }
            test -n "$APPLE_KEYCHAIN_PASSWORD" || { echo "::error::Missing Actions secret APPLE_KEYCHAIN_PASSWORD in the ghostove desktop environment"; exit 1; }
            test -n "$APPLE_ID" || { echo "::error::Missing Actions secret APPLE_ID in the ghostove desktop environment"; exit 1; }
            test -n "$APPLE_PASSWORD" || { echo "::error::Missing Actions secret APPLE_PASSWORD in the ghostove desktop environment"; exit 1; }
            test -n "$APPLE_TEAM_ID" || { echo "::error::Missing Actions secret APPLE_TEAM_ID in the ghostove desktop environment"; exit 1; }
          fi

      - name: Import Apple Developer ID certificate
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/ghostove-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ghostove-build.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$APPLE_SIGNING_IDENTITY" || { echo "::error::APPLE_SIGNING_IDENTITY was not found in the imported certificate"; exit 1; }

      - name: Build and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GHOSTOVE_RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          owner: TonyMike
          repo: ghostove-desktop-releases
          # Keep public release tags rooted in the release-only repo, not private source commits.
          releaseCommitish: master
          tagName: v${{ steps.versioning.outputs.version }}
          releaseName: 'Ghostove Desktop v${{ steps.versioning.outputs.version }}'
          releaseBody: 'Ghostove Stealth HUD - AI Copilot for Technical Interviews.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 3
          args: ${{ matrix.args }}
